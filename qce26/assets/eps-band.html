<!-- The selection problem, drawn still: the course's eps-band figure
     (quantum-oracle-engineering/assets/eps-band.js) at its grown state, with
     the same seven arm means, axis and palette, and no script.  Seven action
     cards stand on a value axis at their means; a band of width epsilon
     reaches left from the best card, and the two cards inside it are the
     acceptable answers. -->

     aria-label="Seven action cards on a value axis. A band of width epsilon extends left from the best card, and the two cards inside it are acceptable answers.">

  <text x="80" y="104" font-size="14" fill="#7a7f88">k actions</text>

  <!-- the epsilon band, from the best value down to best minus epsilon -->
  <rect x="458.2" y="90" width="70" height="110" rx="6" fill="#4D8C55" opacity="0.16"/>
  <line x1="458.2" y1="88" x2="458.2" y2="202" stroke="#4D8C55" stroke-width="2.5"/>
  <line x1="528.2" y1="88" x2="528.2" y2="202" stroke="#4D8C55" stroke-width="2.5"/>
  <text x="493.2" y="78" font-size="16" font-style="italic" font-weight="700" fill="#4D8C55" text-anchor="middle">ε</text>

  <!-- the value axis -->
  <line x1="70" y1="200" x2="710" y2="200" stroke="#2d3140" stroke-width="1.5"/>
  <line x1="80" y1="195" x2="80" y2="205" stroke="#2d3140"/>

  <!-- the cards, each at its mean; the two inside the band drawn in full -->
  <g transform="translate(390,150)" opacity="0.35">
