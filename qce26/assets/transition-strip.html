<!-- Phase 2 as a strip: one cell's update, in the order the paper gives it.
     Read the neighbors, compute a local threshold, compare against the
     explicit dice register, conditionally update, uncompute. -->
<svg viewBox="0 0 900 150" width="1000" role="img"
     aria-label="Five boxes in a row joined by arrows: neighbors, threshold, compare, update, uncompute. A dice register feeds the compare box from below.">
  <defs>
    <marker id="ts-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d3140"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#2d3140" stroke-width="1.3">
    <rect x="20"  y="30" width="150" height="60" rx="8"/>
    <rect x="200" y="30" width="150" height="60" rx="8"/>
    <rect x="380" y="30" width="150" height="60" rx="8"/>
    <rect x="560" y="30" width="150" height="60" rx="8"/>
    <rect x="740" y="30" width="150" height="60" rx="8"/>
  </g>
  <g font-size="18" fill="#2d3140" text-anchor="middle">
    <text x="95"  y="66">neighbors</text>
    <text x="275" y="66">threshold</text>
    <text x="455" y="66">compare</text>
    <text x="635" y="66">update</text>
    <text x="815" y="66">uncompute</text>
  </g>
  <g stroke="#2d3140" stroke-width="1.5" marker-end="url(#ts-arrow)">
    <line x1="170" y1="60" x2="198" y2="60"/>
    <line x1="350" y1="60" x2="378" y2="60"/>
    <line x1="530" y1="60" x2="558" y2="60"/>
    <line x1="710" y1="60" x2="738" y2="60"/>
    <line x1="455" y1="128" x2="455" y2="93"/>
  </g>
  <text x="482" y="140" font-size="15" fill="#7a7f88" text-anchor="middle">dice</text>
</svg>
