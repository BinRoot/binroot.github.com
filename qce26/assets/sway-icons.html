<!-- Sway's three ingredients as line icons: a d20, a 4x4 grid, and the two
     stone colours.  Drawn still, after the icon strip the author supplied. -->
<svg viewBox="0 0 573 203" width="760" role="img"
     aria-label="A twenty-sided die showing 20, an empty four by four grid, and a white stone beside a black stone.">
  <g stroke="#4a4a4a" stroke-width="1.6" stroke-linejoin="round" fill="#f1efea">
    <!-- d20: outer hexagon, central face, and the spokes to the outer vertices -->
    <polygon points="75,43 120,69 120,121 75,147 30,121 30,69"/>
    <polygon points="75,62 104,112 46,112" fill="#e6e3dc"/>
    <line x1="75" y1="62" x2="75" y2="43"/>
    <line x1="75" y1="62" x2="30" y2="69"/>
    <line x1="75" y1="62" x2="120" y2="69"/>
    <line x1="46" y1="112" x2="30" y2="69"/>
    <line x1="46" y1="112" x2="30" y2="121"/>
    <line x1="46" y1="112" x2="75" y2="147"/>
    <line x1="104" y1="112" x2="120" y2="69"/>
    <line x1="104" y1="112" x2="120" y2="121"/>
    <line x1="104" y1="112" x2="75" y2="147"/>
  </g>
  <text x="75" y="102" font-size="15" font-weight="700" fill="#4a4a4a" text-anchor="middle">20</text>

  <!-- the grid -->
  <g stroke="#4a4a4a" stroke-width="1.6" fill="#faf8f4">
    <rect x="215" y="28" width="142" height="142" rx="5"/>
    <line x1="250.5" y1="28" x2="250.5" y2="170"/>
    <line x1="286"   y1="28" x2="286"   y2="170"/>
    <line x1="321.5" y1="28" x2="321.5" y2="170"/>
    <line x1="215" y1="63.5"  x2="357" y2="63.5"/>
    <line x1="215" y1="99"    x2="357" y2="99"/>
    <line x1="215" y1="134.5" x2="357" y2="134.5"/>
  </g>

  <!-- the two stone colours -->
  <circle cx="474" cy="93"  r="19" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="516" cy="113" r="19" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="2"/>
</svg>
