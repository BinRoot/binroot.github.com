<!-- The paper's worked rank-select example, drawn still: N = 8, mask
     M_s = 01101000, valid positions {1, 2, 4}.  Each 1-bit carries the
     rank r that selects it; the equation under the figure gives j_s(r).
     Same palette as eps-band.html. -->
<svg viewBox="0 0 760 190" width="900" role="img"
     aria-label="Eight bit boxes reading 0 1 1 0 1 0 0 0 at positions 0 to 7. The three 1-bits, at positions 1, 2 and 4, are marked with ranks r = 0, r = 1 and r = 2.">
  <text x="44" y="103" font-size="18" fill="#7a7f88" text-anchor="middle"><tspan font-style="italic">M</tspan><tspan font-size="12" dy="5" font-style="italic">s</tspan></text>
  <text x="44" y="158" font-size="18" fill="#7a7f88" text-anchor="middle" font-style="italic">i</text>

  <rect x="70"  y="65" width="60" height="60" rx="6" fill="#fff" stroke="#2d3140" stroke-width="1.3"/>
  <rect x="150" y="65" width="60" height="60" rx="6" fill="#4D8C55" fill-opacity="0.16" stroke="#4D8C55" stroke-width="2.2"/>
  <rect x="230" y="65" width="60" height="60" rx="6" fill="#4D8C55" fill-opacity="0.16" stroke="#4D8C55" stroke-width="2.2"/>
  <rect x="310" y="65" width="60" height="60" rx="6" fill="#fff" stroke="#2d3140" stroke-width="1.3"/>
  <rect x="390" y="65" width="60" height="60" rx="6" fill="#4D8C55" fill-opacity="0.16" stroke="#4D8C55" stroke-width="2.2"/>
  <rect x="470" y="65" width="60" height="60" rx="6" fill="#fff" stroke="#2d3140" stroke-width="1.3"/>
  <rect x="550" y="65" width="60" height="60" rx="6" fill="#fff" stroke="#2d3140" stroke-width="1.3"/>
  <rect x="630" y="65" width="60" height="60" rx="6" fill="#fff" stroke="#2d3140" stroke-width="1.3"/>

  <g font-size="26" fill="#2d3140" text-anchor="middle">
    <text x="100" y="104">0</text>
    <text x="180" y="104">1</text>
    <text x="260" y="104">1</text>
    <text x="340" y="104">0</text>
    <text x="420" y="104">1</text>
    <text x="500" y="104">0</text>
    <text x="580" y="104">0</text>
    <text x="660" y="104">0</text>
  </g>

  <g font-size="15" fill="#7a7f88" text-anchor="middle">
    <text x="100" y="158">0</text>
    <text x="180" y="158">1</text>
    <text x="260" y="158">2</text>
    <text x="340" y="158">3</text>
    <text x="420" y="158">4</text>
    <text x="500" y="158">5</text>
    <text x="580" y="158">6</text>
    <text x="660" y="158">7</text>
  </g>

  <g font-size="15" fill="#4D8C55" font-weight="700" text-anchor="middle">
    <text x="180" y="44"><tspan font-style="italic">r</tspan> = 0</text>
    <text x="260" y="44"><tspan font-style="italic">r</tspan> = 1</text>
    <text x="420" y="44"><tspan font-style="italic">r</tspan> = 2</text>
  </g>
  <g stroke="#4D8C55" stroke-width="1.5">
    <line x1="180" y1="50" x2="180" y2="62"/>
    <line x1="260" y1="50" x2="260" y2="62"/>
    <line x1="420" y1="50" x2="420" y2="62"/>
  </g>
</svg>
