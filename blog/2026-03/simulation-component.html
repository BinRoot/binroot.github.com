<div id="sim-lab">
  <div class="sim-controls">
    <label>Grid
      <input type="number" id="simN" value="8" min="4" max="16">
    </label>
    <label>Games / matchup
      <input type="number" id="simGames" value="500" min="100" max="5000" step="100">
    </label>
    <button id="simRunBtn">Run tournament</button>
  </div>
  <p id="sim-progress"></p>

  <div id="sim-viz" style="display:none">
    <div class="viz-tabs" id="viz-tabs">
      <button class="viz-tab active" data-tab="heatmap">Heatmap</button>
      <button class="viz-tab" data-tab="elo">Elo Rankings</button>
      <button class="viz-tab" data-tab="bracket">Bracket</button>
      <button class="viz-tab" data-tab="graph">Network</button>
      <button class="viz-tab" data-tab="stacked">Overall</button>
    </div>
    <div class="viz-panel" id="viz-heatmap"></div>
    <div class="viz-panel" id="viz-elo" style="display:none"></div>
    <div class="viz-panel" id="viz-bracket" style="display:none"></div>
    <div class="viz-panel" id="viz-graph" style="display:none"></div>
    <div class="viz-panel" id="viz-stacked" style="display:none"></div>
  </div>
</div>
