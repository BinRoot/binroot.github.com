<script>
(function () {
  var box = document.querySelector('.swap');
  if (!box || !box.animate) return;
  var words = box.querySelectorAll(':scope > span');
  if (words.length !== 2) return;
  var a = words[0], b = words[1];
  var swapped = false;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hover = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // Hop a word from one x-offset to another along a small arc. The word
  // moving right goes over, the word moving left ducks under.
  function hop(el, from, to) {
    el.getAnimations().forEach(function (an) { an.cancel(); });
    var lift = to > from ? '-0.7em' : '0.4em';
    var an = el.animate([
      { transform: 'translate(' + from + 'px, 0)' },
      { transform: 'translate(' + (from + to) / 2 + 'px, ' + lift + ')', offset: 0.5 },
      { transform: 'translate(' + to + 'px, 0)' }
    ], { duration: reduce ? 0 : 650, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' });
    an.finished.then(function () { an.commitStyles(); an.cancel(); }).catch(function () {});
  }

  function set(on) {
    if (on === swapped) return;
    swapped = on;
    // offset* values describe the resting layout, unaffected by transforms.
    var gap = b.offsetLeft - (a.offsetLeft + a.offsetWidth);
    var da = b.offsetWidth + gap;
    var db = -(a.offsetWidth + gap);
    if (on) { hop(a, 0, da); hop(b, 0, db); }
    else    { hop(a, da, 0); hop(b, db, 0); }
    box.classList.toggle('is-swapped', on);
    box.setAttribute('aria-pressed', String(on));
  }

  if (hover) {
    box.addEventListener('mouseenter', function () { set(true); });
    box.addEventListener('mouseleave', function () { set(false); });
  } else {
    box.addEventListener('click', function () { set(!swapped); });
  }
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(!swapped); }
  });
})();
</script>
