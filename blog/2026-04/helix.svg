<svg viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">
  <title>Quantum circuit transitioning into a double-helix of entanglement</title>
  <defs>
    <linearGradient id="fade-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9f9f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#f9f9f9" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="760" height="180" fill="#f9f9f9"/>

  <!-- Wire labels -->
  <text x="26" y="60" text-anchor="end" font-family="'Ubuntu Mono',monospace" font-size="12" fill="#999" dominant-baseline="central">sys</text>
  <text x="26" y="120" text-anchor="end" font-family="'Ubuntu Mono',monospace" font-size="12" fill="#999" dominant-baseline="central">anc0</text>

  <!-- Line 1 (sys — teal) -->
  <path d="M 30 60 L 270 60 C 285 60, 290 74, 300 90
           C 320 130, 340 130, 360 90
           C 380 50, 400 50, 420 90
           C 440 130, 460 130, 480 90
           C 500 50, 520 50, 540 90
           C 560 130, 580 130, 600 90
           C 620 50, 640 50, 660 90
           C 680 130, 700 130, 720 90"
        fill="none" stroke="#1d7484" stroke-width="2" stroke-linecap="round"/>

  <!-- Line 2 (anc — rose) -->
  <path d="M 30 120 L 270 120 C 285 120, 290 106, 300 90
           C 320 50, 340 50, 360 90
           C 380 130, 400 130, 420 90
           C 440 50, 460 50, 480 90
           C 500 130, 520 130, 540 90
           C 560 50, 580 50, 600 90
           C 620 130, 640 130, 660 90
           C 680 50, 700 50, 720 90"
        fill="none" stroke="#982c61" stroke-width="2" stroke-linecap="round"/>

  <!-- Crossing depth: line 1 behind at x = 360, 480, 600 -->
  <!-- erase line 1, redraw line 2 -->
  <line x1="356" y1="96.3" x2="364" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="356" y1="83.7" x2="364" y2="96.3" stroke="#982c61" stroke-width="2" stroke-linecap="round"/>

  <line x1="476" y1="96.3" x2="484" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="476" y1="83.7" x2="484" y2="96.3" stroke="#982c61" stroke-width="2" stroke-linecap="round"/>

  <line x1="596" y1="96.3" x2="604" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="596" y1="83.7" x2="604" y2="96.3" stroke="#982c61" stroke-width="2" stroke-linecap="round"/>

  <!-- Crossing depth: line 2 behind at x = 420, 540, 660 -->
  <!-- erase line 2, redraw line 1 -->
  <line x1="416" y1="96.3" x2="424" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="416" y1="83.7" x2="424" y2="96.3" stroke="#1d7484" stroke-width="2" stroke-linecap="round"/>

  <line x1="536" y1="96.3" x2="544" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="536" y1="83.7" x2="544" y2="96.3" stroke="#1d7484" stroke-width="2" stroke-linecap="round"/>

  <line x1="656" y1="96.3" x2="664" y2="83.7" stroke="#f9f9f9" stroke-width="6" stroke-linecap="round"/>
  <line x1="656" y1="83.7" x2="664" y2="96.3" stroke="#1d7484" stroke-width="2" stroke-linecap="round"/>

  <!-- Gates (drawn on top of wires) -->

  <!-- CX gate 1 at x=100 -->
  <circle cx="100" cy="60" r="4" fill="#1d7484"/>
  <line x1="100" y1="64" x2="100" y2="104" stroke="#bbb" stroke-width="1.5"/>
  <rect x="83" y="104" width="34" height="32" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="100" y="120" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu',sans-serif" font-size="14" font-weight="500" fill="#4a4a4a">X</text>

  <!-- Z gate at x=165 -->
  <rect x="148" y="104" width="34" height="32" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="165" y="120" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu',sans-serif" font-size="14" font-weight="500" fill="#4a4a4a">Z</text>

  <!-- CX gate 2 at x=230 -->
  <circle cx="230" cy="60" r="4" fill="#1d7484"/>
  <line x1="230" y1="64" x2="230" y2="104" stroke="#bbb" stroke-width="1.5"/>
  <rect x="213" y="104" width="34" height="32" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="230" y="120" text-anchor="middle" dominant-baseline="central" font-family="'Ubuntu',sans-serif" font-size="14" font-weight="500" fill="#4a4a4a">X</text>

  <!-- Fade-out on right edge -->
  <rect x="680" y="0" width="80" height="180" fill="url(#fade-right)"/>
</svg>
