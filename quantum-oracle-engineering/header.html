/* Every card carries the flat background colour of its own illustration as
   --accent, set in index.md beside the picture it was sampled from.  Nothing
   shows it until you point at the card, and then the colour bleeds out of the
   frame and fills the card behind the text.  `multiply` is what hides the
   seam: white multiplied by any backdrop is that backdrop, so the artwork's
   white margin dissolves into whatever is behind it, the page normally and
   the wash on hover, instead of sitting on either as a white square. */
.lesson .art img {
  mix-blend-mode: multiply;
}
/* The plate is what the artwork multiplies against, which is why `.lesson`
   isolates: the blend stops at the card instead of reaching the whole page.
   It is always painted, and wears the page's own colour until you point at
   the card.  It has to be opaque rather than a wash faded up from zero,
   because multiply against a transparent backdrop is a no-op: a plate at
   `opacity: 0` switches the blending off in the resting state, which is the
   state the page is in almost all of the time. */

  content: "";
  position: absolute;
  z-index: -1;
  inset: 0 -0.9em -0.9em;
  border-radius: 3px;
  background: #fcfcfa;

/* The lit state, defined once and only once.  A card reaches it by being
   pointed at, by holding focus, or by spotlight.js marking it while a phone
   scrolls.  Everything the state does is nested here, so the wash, the rule,
   the buttons and the boil cannot drift apart the way they do when each lives
   in its own rule with the selector copied across all of them. */

    background: color-mix(in oklab, var(--accent) 9%, #fcfcfa);
    box-shadow: 0 6px 18px color-mix(in oklab, var(--accent) 22%, transparent);
  }
  & button {
    border-color: var(--accent);

  & button.coming {
    color: var(--accent);

     the spread it shows under its own pointer instead. */
  & a.deck {
    box-shadow: 0 8px 22px color-mix(in oklab, var(--accent) 48%, transparent);
  }

  /* Both of these are motion, so both sit behind the same guard: the card
     lifts, and the artwork boils inside its frame.  Mouse-driven browsers
     only: iOS Safari renders an SVG filter referenced from CSS unreliably on
     images, and a blank card reads as a broken page. */
  @media (prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine) {
    transform: translateY(-2px);

    & .art img {
      filter: url(#boil);

       filters in index.md for why one set of numbers cannot serve both. */
    @media (max-width: 700px) {
      & .art img {
        filter: url(#boil-narrow);
      }
    }
  }

/* ── The lesson a hash names, run full bleed ──────────────────────────
   Reached by its own URL, a lesson stops being one card among twelve: it
   takes the whole row and its wash runs past the grid to both page edges,
   so the band reads as a chapter opener while the eleven around it stay a
   grid.  Only the colour bleeds.  The card keeps the grid's width, and that
   is what holds the text to a measure while the band goes edge to edge. */
.lesson:target {
  grid-column: 1 / -1;
  /* The band's own top edge separates it from what is above, so the card's
     hairline would only draw a rule across the middle of a coloured field. */
  border-top-color: transparent;
}
/* 100vw counts the vertical scrollbar, so the band overruns the page by a
   scrollbar's width.  Clip it at the root: body is narrower than the window
   and centred, so clipping there would crop the bleed itself.  `clip` rather
   than `hidden`, which would turn the root into a scroll container. */
html { overflow-x: clip; }
.lesson:target::before {
  left: 50%;
  right: auto;
  width: 100vw;
  margin-left: -50vw;
  border-radius: 0;
  border-top: 1px solid color-mix(in oklab, var(--accent) 30%, #d8d5cd);
}
/* The width the band buys is spent on two columns rather than on a longer
   line: the art holds one, the heading, the bullets and the button stack in
   the other, and the bullets themselves split in two.  Below the grid's own
   single-column breakpoint the card is already the full width of the page
   and the stacked layout it already has is the right one. */

  .lesson:target {
    display: grid;
    grid-template-columns: min(17em, 26%) minmax(0, 1fr);
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      "art title"
      "art list"
      "art cta";
    column-gap: 2.6em;
    padding-top: 1.8em;
  }
  .lesson:target > .art  { grid-area: art; margin-bottom: 0; }
  .lesson:target > h2    { grid-area: title; }
  .lesson:target > ul    { grid-area: list; columns: 2; column-gap: 2.6em; }
  .lesson:target > ul li { break-inside: avoid; }
  .lesson:target > .act  { grid-area: cta; align-self: start; margin-top: 0; }
}
.filters {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
/* The colour change is not motion and stays; the lift and boil are declared
   with the lit state above and are the only things this guard removes. */

  .lesson {

@media (max-width: 700px) {
  .lessons {

  /* One column is wide enough that left-aligned cards read as a ragged strip

     so every one of them shrinks to its own width and sits in the middle. */
  .lesson {
    align-items: center;
    text-align: center;
  }
  /* The list is centred as a block but keeps its text ranged left, so the
     bullets stay in one column instead of fanning out around the centre. */
  .lesson ul {
    text-align: left;
  }
  /* Without signup.js the chip is a direct child, and it carries an
     align-self of its own that would otherwise pull it back to the edge. */
  .lesson > button {
    align-self: center;

     screenful of scrolling per lesson.  Hold it near its three-column size. */
  .lesson .art {
    max-width: 16em;

/* The signature: one thin rule carrying all twelve lesson colours in order,
   the course's arc compressed to a line.  Hard stops, no blending. */
.spectrum {
  height: 4px;
  max-width: 34em;
  margin: 0 auto 3em;
  border-radius: 2px;
  background: linear-gradient(90deg,
    #456AAD 0 8.33%, #4D8C55 0 16.66%, #C35523 0 25%, #F03836 0 33.33%,
