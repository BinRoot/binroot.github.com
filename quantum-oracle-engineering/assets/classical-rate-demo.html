<!-- Slide 15's anchor: the dartboard rounds.  Darts thwack into a board in
     three rounds (100, 400, 1,600 total), fire rate ramping; the scatter
     never changes, but the centroid crosshair steadies and its grouping
     circle halves per round while the dart count quadruples.  Presenter
     controlled from the console panel, which is also the launcher; opens
     paused with an empty board.  Reduced motion shows the final frame. -->

  #classical-rate-fig .cr-play:hover circle:first-child { opacity: 0.24; }
</style>
