<!-- Lesson 2 shared styles and scripts.  Included once, on the title slide;
     styles apply deck-wide and the two deferred scripts run before every
     later fragment's own script (deferred scripts execute in document
     order).  sway-data.js is generated by gen/sway-gen.mjs. -->
<style>
  /* Evidence badge: one per quantitative slide, top-right corner. */
  .badge {
    position: absolute;
    top: 4.5vh;
    right: 5vw;
    right: 5cqw;
    font-size: 0.42em;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.25em 0.8em;
    border: 1px solid currentColor;
    border-radius: 999px;
    color: #7a7f88;
    pointer-events: none;
  }
  .badge.theorem     { color: #456AAD; }
  .badge.assumption  { color: #7c5cbf; }
  .badge.measured    { color: #4D8C55; }
  .badge.judgment    { color: #D95032; }
  .badges { position: absolute; top: 4.5vh; right: 5vw; right: 5cqw; display: flex; gap: 0.5em; }
  .badges .badge { position: static; }

  /* Figure wrapper shared by every fragment. */
  .l2-fig { display: flex; justify-content: center; margin: 4px 0; }
  .l2-fig svg { max-width: 100%; font-family: 'Ubuntu Web', 'Ubuntu', sans-serif; }
  .l2-note { text-align: center; color: #7a7f88; font-size: 0.5em; margin: 0.3em auto 0; }

  /* Deck-wide: SVG groups marked .step follow the same reveal rules as text. */
  svg .step { opacity: 0; }
  svg .step.shown { opacity: 1; }

  /* The persistent corner race panel, built by sway-race.js. */
  #race-panel {
    position: fixed;
    right: 1.6rem;
    bottom: 2.6rem;
    z-index: 8;
    width: min(26vw, 340px);
    padding: 0.5rem 0.7rem 0.55rem;
    background: rgba(250, 248, 244, 0.96);
    border: 1px solid #d8d5cd;
    border-radius: 8px;
    display: none;
    font-family: 'Ubuntu Web', 'Ubuntu', sans-serif;
  }
  body.race-on #race-panel { display: block; }
  body.grid-on #race-panel, body.outline-on #race-panel, body.help-on #race-panel { display: none; }
  #race-panel svg { display: block; width: 100%; height: auto; }
  @media print { #race-panel { display: none !important; } }
  @media (orientation: landscape) and (min-width: 900px) {
    body.drawer-on #race-panel { right: calc(var(--notes-w) + 1.6rem); }
  }
</style>
<script src="../assets/sway-data.js" defer></script>
<script src="../assets/l2.js" defer></script>
