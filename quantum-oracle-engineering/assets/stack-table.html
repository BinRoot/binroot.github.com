<!-- Slide 7's anchor: the compute stack as a living table.  Three rows (CPU,
     GPU, QPU), each a framework step so they reveal one per press.  Device
     thumbnails reuse segment B's die shots; the QPU row draws the
     overlapping-boards motif, since no die shot exists for it.  Strength
     cells are small CSS-animated glyphs (stopwatch, lanes, converging dots);
     the QPU strength cell carries grayed simulation and factoring marks per
     the scoping rule.  All motion is CSS keyframes, so reduced-motion
     freezes to sensible static states. -->
<style>
  #stack-table { max-width: 920px; margin: 6px auto; font-family: 'Ubuntu', sans-serif; }
  #stack-table .st-row {
    display: grid; grid-template-columns: 170px 1.1fr 1.5fr;
    gap: 0 34px; align-items: center; padding: 10px 0; border-top: 1px solid #e8e8e8;
  }
  #stack-table .st-row.st-head { border-top: 0; padding: 0 0 2px; }
  #stack-table .st-hdr {
    font-size: 11px; color: #999; letter-spacing: 0.12em; text-transform: uppercase;
  }
  #stack-table .st-dev {
    display: flex; align-items: center; gap: 14px;
    font-weight: 700; color: #2d3140; font-size: 19px;
  }
  #stack-table .st-dev img { width: 86px; height: auto; border-radius: 5px; }
  #stack-table .st-cell { display: flex; align-items: flex-end; gap: 22px; }
  #stack-table .st-glyph { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #stack-table .st-cap { font-size: 12px; color: #888; }
  #stack-table .st-ghost { opacity: 0.32; }

  /* CPU strength: one hand sweeping a stopwatch. */
  #stack-table .st-hand {
    transform-box: view-box; transform-origin: 50% 50%;
    animation: st-spin 2.4s linear infinite;
  }
  @keyframes st-spin { to { transform: rotate(360deg); } }

  /* GPU strength: blocks streaming down parallel lanes, staggered. */
  #stack-table .st-lane {
    animation: st-flow 1.6s linear infinite;
  }
  @keyframes st-flow { from { transform: translateX(0); } to { transform: translateX(44px); } }

  /* QPU strength: a scattered sample cloud converging on one precise estimate.
     The scatter is the base state, so reduced motion shows the cloud. */
  #stack-table .st-dot {
    transform: translate(var(--dx), var(--dy)); opacity: 0.65;
    animation: st-converge 3s ease-in infinite;
  }
  @keyframes st-converge {
    0% { transform: translate(var(--dx), var(--dy)); opacity: 0.65; }
    70% { transform: translate(0, 0); opacity: 0.9; }
    82%, 100% { transform: translate(0, 0); opacity: 0; }
  }
  #stack-table .st-mean { animation: st-beat 3s ease-in infinite; }
  @keyframes st-beat { 0%, 65% { r: 3; } 75% { r: 5; } 100% { r: 3; } }

  @media (prefers-reduced-motion: reduce) {
    #stack-table * { animation: none !important; }
  }
  @media (max-width: 700px) {
    #stack-table .st-row { grid-template-columns: 110px 1fr 1.2fr; gap: 0 16px; }
    #stack-table .st-dev img { width: 62px; }
    #stack-table .st-dev { font-size: 15px; }
  }
</style>
